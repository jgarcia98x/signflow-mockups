<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SignFlow — All Jobs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:          #D32F2F;
      --red-dark:     #B71C1C;
      --red-glow:     rgba(211,47,47,0.4);
      --red-glow-sm:  rgba(211,47,47,0.25);
      --amber:        #F9A825;
      --green:        #66BB6A;
      --bg:           #0c0c14;
      --surface:      rgba(255,255,255,0.06);
      --surface-mid:  rgba(255,255,255,0.09);
      --border:       rgba(255,255,255,0.10);
      --border-hi:    rgba(255,255,255,0.20);
      --text:         rgba(255,255,255,0.93);
      --text-muted:   rgba(255,255,255,0.55);
      --text-dim:     rgba(255,255,255,0.32);
      --shadow-card:  0 4px 20px rgba(0,0,0,0.45);
    }

    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at 30% 0%, #1a1422 0%, var(--bg) 65%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      background: rgba(180,30,30,0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      z-index: 200;
      box-shadow: 0 2px 20px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.06);
    }
    .logo {
      font-size: 20px; font-weight: 800; color: #fff;
      letter-spacing: -0.5px; margin-right: 8px;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
    }
    .header-sep { width: 1px; height: 24px; background: rgba(255,255,255,0.2); }
    nav a {
      color: rgba(255,255,255,0.70);
      text-decoration: none; font-size: 13px; font-weight: 500;
      padding: 5px 11px; border-radius: 7px;
      transition: color .15s, background .15s; letter-spacing: 0.1px;
    }
    nav a:hover { color: #fff; background: rgba(255,255,255,0.12); }
    nav a.active {
      color: #fff; background: rgba(255,255,255,0.15);
      box-shadow: 0 0 12px rgba(255,255,255,0.08);
    }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .date-chip { font-size: 12px; color: rgba(255,255,255,0.72); font-weight: 500; }
    .btn-new {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
      color: #fff; border-radius: 7px; padding: 7px 16px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      backdrop-filter: blur(8px); transition: background .15s, box-shadow .15s; letter-spacing: 0.1px;
    }
    .btn-new:hover { background: rgba(255,255,255,0.22); box-shadow: 0 0 16px rgba(255,255,255,0.12); }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff; cursor: pointer;
    }

    /* ── SUB BAR ── */
    .sub-bar {
      background: rgba(255,255,255,0.04); border-bottom: 1px solid var(--border);
      padding: 8px 24px; display: flex; align-items: center; gap: 12px;
      flex-shrink: 0; backdrop-filter: blur(12px);
    }
    .sub-bar-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .pipeline-value {
      font-size: 13px; font-weight: 700;
      color: var(--amber); margin-left: 4px;
    }
    .filter-pills { display: flex; gap: 5px; }
    .filter-pill {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px 11px; font-size: 11px;
      color: var(--text-muted); cursor: pointer; transition: all .15s;
    }
    .filter-pill:hover { border-color: var(--red); color: #ff6b6b; }
    .filter-pill.active {
      border-color: rgba(211,47,47,0.5); color: #ff6b6b;
      background: rgba(211,47,47,0.12); font-weight: 600;
      box-shadow: 0 0 10px rgba(211,47,47,0.25);
    }
    .search-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 7px; padding: 5px 12px; font-size: 12px;
      color: var(--text); outline: none; width: 200px;
      transition: border-color .15s, box-shadow .15s; margin-left: auto;
    }
    .search-box::placeholder { color: var(--text-dim); }
    .search-box:focus { border-color: rgba(211,47,47,0.5); box-shadow: 0 0 10px rgba(211,47,47,0.25); }

    /* ── TABLE WRAPPER ── */
    .table-wrap {
      flex: 1; overflow-y: auto; padding: 20px 24px 32px;
    }

    /* ── TABLE ── */
    table {
      width: 100%; border-collapse: collapse;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    thead th {
      background: rgba(255,255,255,0.06);
      padding: 10px 14px; text-align: left;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.7px;
      color: var(--text-muted); border-bottom: 1px solid var(--border);
      cursor: pointer; user-select: none; white-space: nowrap;
      transition: color .15s, background .15s;
    }
    thead th:hover { color: var(--text); background: rgba(255,255,255,0.09); }
    thead th.sort-asc::after { content: ' ▲'; color: #ff6b6b; }
    thead th.sort-desc::after { content: ' ▼'; color: #ff6b6b; }
    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer; transition: background .12s;
    }
    tbody tr:hover { background: rgba(255,255,255,0.05); }
    tbody tr.hidden { display: none; }
    tbody td {
      padding: 11px 14px; font-size: 13px;
      color: var(--text); vertical-align: middle;
    }
    tbody td.muted { color: var(--text-muted); }

    /* Stage pills */
    .stage-pill {
      display: inline-block; border-radius: 12px;
      padding: 2px 10px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.3px;
    }

    /* Type badge */
    .type-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 700; border-radius: 6px;
      padding: 1px 7px;
    }
    .type-badge.indoor {
      color: rgba(100,180,255,0.90); background: rgba(100,180,255,0.10);
      border: 1px solid rgba(100,180,255,0.25);
    }
    .type-badge.outdoor {
      color: rgba(255,190,80,0.90); background: rgba(255,190,80,0.10);
      border: 1px solid rgba(255,190,80,0.25);
    }

    /* Priority badge */
    .priority-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .priority-badge.urgent { color: #ef5350; }
    .priority-badge.high   { color: var(--amber); }
    .priority-badge.normal { color: var(--text-muted); }
    .priority-badge.cold   { color: #4FC3F7; }
    .priority-badge.lost   { color: rgba(255,255,255,0.38); }
    .priority-badge.done   { color: var(--green); }

    /* Due date */
    .due-overdue { color: #ef5350; font-weight: 600; }
    .due-soon    { color: var(--amber); }
    .due-none    { color: var(--text-dim); }

    /* Value */
    .value-tbd { color: var(--text-dim); font-style: italic; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(30,30,44,0.97); border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(20px); border-radius: 10px;
      padding: 10px 20px; font-size: 13px; font-weight: 600; color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6); z-index: 9999;
      opacity: 0; transition: opacity .22s, transform .22s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center; padding: 48px 24px; color: var(--text-dim);
      font-size: 14px;
    }

    /* ── MOBILE ── */
    @media (max-width: 1024px) {
      header { flex-wrap: wrap; height: auto; padding: 10px 14px 0; gap: 8px; }
      .header-sep { display: none; }
      .date-chip { display: none; }
      .avatar { display: none; }
      .header-right { margin-left: auto; }
      nav {
        width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
        display: flex; gap: 0; border-top: 1px solid rgba(255,255,255,0.08);
        padding: 0; scrollbar-width: none;
      }
      nav::-webkit-scrollbar { display: none; }
      nav a {
        flex-shrink: 0; font-size: 13px; padding: 10px 14px;
        border-radius: 0; border-bottom: 2px solid transparent;
      }
      nav a.active { border-bottom: 2px solid rgba(255,255,255,0.9); }
      .sub-bar { flex-wrap: wrap; padding: 8px 14px; gap: 8px; }
      .filter-pills { flex-wrap: wrap; gap: 4px; }
      .search-box { width: 100%; margin-left: 0; }
      .table-wrap { padding: 12px 14px 24px; overflow-x: auto; }
      table { min-width: 760px; }
    }
  </style>
<link rel="stylesheet" href="signflow-calm.css?v=202608160139">
<script src="signflow-store.js?v=202608160139"></script>

<style>
  /* ── View switcher ─────────────────────────────────────────── */
  /* The page is a fixed-height flex column with overflow hidden on
     body, so only a designated child may scroll. Originally that was
     .table-wrap. The new panes must own their own scrolling or their
     content is simply clipped — the embedded Reports view is ~8000px
     tall and was unreachable below the fold. */
  .view-switch{
    display:flex; gap:4px; padding:10px 24px 0;
    border-bottom:1px solid rgba(255,255,255,0.07);
    flex-shrink:0; overflow-x:auto; scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .view-switch::-webkit-scrollbar{ display:none; }
  .sub-bar{ flex-shrink:0; }

  .sf-view{
    flex:1 1 auto; min-height:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  /* Jobs keeps its inner scroller so the sticky table header still
     behaves; the pane itself must not double-scroll. */
  #view-jobs{ display:flex; flex-direction:column; overflow:hidden; }
  .vs-tab{
    padding:9px 16px; font-size:12.5px; font-weight:600; cursor:pointer;
    color:rgba(255,255,255,0.45); border-bottom:2px solid transparent;
    border-radius:6px 6px 0 0; transition:color .15s, border-color .15s;
    user-select:none; white-space:nowrap;
  }
  .vs-tab:hover{ color:rgba(255,255,255,0.75); background:rgba(255,255,255,0.03); }
  .vs-tab.active{ color:#fff; border-bottom-color:#5B8FC7; }

  /* ── Smart Conversions ──────────────────────────────────────────── */
  .wp-wrap{ padding:20px 24px 56px; }
  #view-reports{ padding:0 24px 56px; }
  @media (max-width:820px){
    .wp-wrap{ padding:16px 14px 48px; }
    #view-reports{ padding:0 14px 48px; }
    .view-switch{ padding:8px 14px 0; }
    .wp-kpis{ grid-template-columns:1fr 1fr; }
  }
  .wp-note{
    display:flex; gap:11px; align-items:flex-start;
    background:rgba(217,164,65,.16);
    border:1px solid rgba(217,164,65,.55);
    border-left:4px solid #D9A441;
    border-radius:9px; padding:13px 15px; margin-bottom:18px;
    font-size:12px; line-height:1.55; color:rgba(255,255,255,.88);
  }
  .wp-note b{ color:#F0C878; }
  .wp-kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
  @media (max-width:900px){ .wp-kpis{ grid-template-columns:repeat(2,1fr); } }
  .wp-kpi{
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
    border-radius:11px; padding:14px 15px;
  }
  .wp-kpi-label{
    font-size:9px; text-transform:uppercase; letter-spacing:.7px;
    color:rgba(255,255,255,.38); font-weight:700; margin-bottom:6px;
  }
  .wp-kpi-val{ font-size:23px; font-weight:800; letter-spacing:-.5px; }
  .wp-kpi-sub{ font-size:10.5px; color:rgba(255,255,255,.4); margin-top:3px; }

  .wp-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:1000px){ .wp-grid{ grid-template-columns:1fr; } }

  .wp-card{
    background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.08);
    border-radius:12px; padding:16px 17px; margin-bottom:16px;
  }
  .wp-card-title{
    font-size:12.5px; font-weight:700; margin-bottom:3px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .wp-card-sub{ font-size:10.5px; color:rgba(255,255,255,.4); margin-bottom:13px; }

  .wp-row{ margin-bottom:12px; }
  .wp-row:last-child{ margin-bottom:0; }
  .wp-row-top{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:8px; margin-bottom:5px; font-size:12px;
  }
  .wp-row-name{ font-weight:600; }
  .wp-row-meta{ font-size:10.5px; color:rgba(255,255,255,.42); }
  .wp-bar{ height:7px; border-radius:4px; background:rgba(255,255,255,0.07); overflow:hidden; }
  .wp-bar-fill{ height:100%; border-radius:4px; background:#5B8FC7; transition:width .5s ease; }
  .wp-bar-fill.thin{ background:rgba(255,255,255,.22); }
  .wp-early{
    font-size:9px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    color:rgba(150,190,235,.95); background:rgba(91,143,199,.14);
    border:1px solid rgba(91,143,199,.34); border-radius:5px;
    padding:1px 5px; margin-left:6px; white-space:nowrap;
  }
  .wp-lowconf{
    font-size:9px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    color:rgba(217,164,65,.9); background:rgba(217,164,65,.12);
    border:1px solid rgba(217,164,65,.3); border-radius:5px;
    padding:1px 5px; margin-left:6px; white-space:nowrap;
  }
  /* ── Actionable rows ───────────────────────────────────────── */
  .wp-job{
    display:block; text-decoration:none; color:inherit;
    padding:10px 11px; margin-bottom:7px; border-radius:9px;
    background:rgba(255,255,255,0.035);
    border:1px solid rgba(255,255,255,0.07);
    transition:background .15s, border-color .15s, transform .12s;
  }
  .wp-job:last-child{ margin-bottom:0; }
  .wp-job:hover{
    background:rgba(91,143,199,0.10); border-color:rgba(91,143,199,0.42);
    transform:translateX(2px);
  }
  .wp-job-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .wp-job-name{ font-size:12.5px; font-weight:650; }
  .wp-job-meta{ font-size:10.5px; color:rgba(255,255,255,.45); margin-top:3px; }

  .wp-score{
    font-size:11px; font-weight:800; padding:2px 7px; border-radius:6px;
    white-space:nowrap; flex-shrink:0;
  }
  .wp-score.hot { color:#7FD1A0; background:rgba(90,190,130,.14); border:1px solid rgba(90,190,130,.34); }
  .wp-score.warm{ color:#E2B457; background:rgba(217,164,65,.13); border:1px solid rgba(217,164,65,.32); }
  .wp-score.cool{ color:rgba(255,255,255,.55); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); }

  .wp-why-row{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .wp-why{
    font-size:9.5px; font-weight:600; padding:1px 6px; border-radius:5px;
    white-space:nowrap;
  }
  .wp-why.up  { color:#7FD1A0; background:rgba(90,190,130,.10); }
  .wp-why.down{ color:#E2A0A0; background:rgba(210,90,90,.10); }
  .wp-why-none{ font-size:9.5px; color:rgba(255,255,255,.3); }

  .wp-late{
    font-size:11px; font-weight:800; color:#E2A0A0;
    background:rgba(210,90,90,.13); border:1px solid rgba(210,90,90,.3);
    padding:2px 7px; border-radius:6px; white-space:nowrap; flex-shrink:0;
  }
  .wp-empty{ font-size:11.5px; color:rgba(255,255,255,.45); padding:4px 0 2px; }
  .wp-foot{
    font-size:10.5px; color:rgba(255,255,255,.42);
    margin-top:10px; padding-top:9px; border-top:1px solid rgba(255,255,255,.07);
  }
  .wp-gap-txt{ font-size:11.5px; line-height:1.55; color:rgba(255,255,255,.6); margin-bottom:10px; }
  .wp-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .wp-chip{
    display:inline-block; font-size:10.5px; padding:3px 9px; border-radius:20px;
    background:rgba(91,143,199,.13); border:1px solid rgba(91,143,199,.32);
    color:rgba(255,255,255,.8);
  }
  .wp-chips .wp-job{ display:inline-block; padding:0; margin:0; background:none; border:none; }
  .wp-chips .wp-job:hover{ transform:none; background:none; }
  .wp-chips .wp-job:hover .wp-chip{ background:rgba(91,143,199,.26); }

  .wp-hist-head{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.8px;
    color:rgba(255,255,255,.4); margin:26px 0 12px;
    padding-top:16px; border-top:1px solid rgba(255,255,255,.08);
  }
  .wp-hist-head span{
    text-transform:none; letter-spacing:0; font-weight:500;
    color:rgba(255,255,255,.28); margin-left:7px;
  }

  .wp-insight{
    display:flex; gap:11px; align-items:flex-start; padding:11px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .wp-insight:last-child{ border-bottom:none; }
  .wp-ins-icon{ font-size:17px; line-height:1.3; flex-shrink:0; }
  .wp-ins-text{ font-size:12px; line-height:1.55; }
  .wp-ins-action{ font-size:10.5px; color:rgba(255,255,255,.42); margin-top:2px; }
  .wp-fast{ font-size:11px; color:rgba(255,255,255,.55); margin-top:10px; }
</style>
</head>

<!-- ══ HEADER ═══════════════════════════════════════════════════ -->
<header>
  <div class="logo">SignFlow</div>
  <div class="header-sep"></div>
  <nav>
    <a href="index.html">Pipeline</a>
    <a href="schedule.html">Schedule</a>
    <a href="customers.html">Customers</a>
    <a href="jobs.html" class="active">Jobs &amp; Reports</a>

  <div class="header-right">
    <div class="date-chip" id="date-chip">📅 Sun, Aug 2, 2026</div>

    <div class="avatar">PG</div>

</header>

<!-- ══ VIEW SWITCHER (Jobs / Reports / Smart Conversions) ═══════════ -->
<div class="view-switch">
  <div class="vs-tab active" data-view="jobs">📋 All Jobs</div>
  <div class="vs-tab" data-view="reports">📊 Reports</div>
  <div class="vs-tab" data-view="wins">⚡ Smart Conversions</div>
</div>

<!-- ══ SUB BAR ═══════════════════════════════════════════════════ -->
<div class="sub-bar" id="jobs-subbar">

  <span class="pipeline-value" id="pipeline-val">$244,800</span>
  <div class="filter-pills">
    <div class="filter-pill active" data-filter="all">All</div>
    <div class="filter-pill" data-filter="active">Active</div>

<!-- ══ VIEW: JOBS ══════════════════════════════════════════════ -->
<div class="sf-view" id="view-jobs">
<div class="table-wrap">
  <table id="jobs-table">
    <thead>
      <tr>
        <th data-col="name">Job Name</th>
        <th data-col="client">Client</th>
        <th data-col="stage">Stage</th>
        <th data-col="type">Type</th>

        <th data-col="due">Due Date</th>

</div>
</div><!-- /view-jobs -->

<!-- ══ VIEW: REPORTS ═══════════════════════════════════════════
     Reports keeps its own page (it is 47KB of chart code) and is
     embedded here so the two tabs merge without duplicating any of
     it. ?embed=1 tells reports.html to drop its header and nav. -->
<div class="sf-view" id="view-reports" style="display:none;">
  <iframe id="reports-frame" title="Reports"
          scrolling="no"
          style="width:100%;border:0;background:transparent;height:600px;display:block;"></iframe>
</div>

<!-- ══ VIEW: SMART CONVERSIONS ══════════════════════════════════════ -->

<!-- ══ TOAST ════════════════════════════════════════════════════ -->
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ── Date chip ── */
  (function(){
    var el = document.getElementById('date-chip');
    if (!el) return;
    var d = new Date();
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    el.textContent = '📅 ' + days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  })();

  /* ── Stage config ── */
  var STAGE_COLORS = {
    'New Inquiry':  { bg:'rgba(180,79,245,0.18)',  border:'rgba(180,79,245,0.5)',  text:'#C880FF' },
    'Quote':        { bg:'rgba(240,82,154,0.18)',   border:'rgba(240,82,154,0.5)',  text:'#FF85C2' },
    'Design':       { bg:'rgba(0,200,212,0.18)',    border:'rgba(0,200,212,0.5)',   text:'#2ED8E4' },
    'Approval':     { bg:'rgba(240,192,64,0.18)',   border:'rgba(240,192,64,0.5)',  text:'#F0C040' },
    'Fabrication':  { bg:'rgba(240,112,64,0.18)',   border:'rgba(240,112,64,0.5)',  text:'#F07040' },
    'Install':      { bg:'rgba(80,216,128,0.18)',   border:'rgba(80,216,128,0.5)',  text:'#50D880' },
    'Complete':     { bg:'rgba(118,224,64,0.18)',   border:'rgba(118,224,64,0.5)',  text:'#76E040' },
  };

  /* ── Job data ── */
  /* Due dates now come from the shared store, so a date edited in the
     pipeline shows here too — these used to be three separate copies. */
  function storeDue(name){
    if (!window.SFStore) return null;
    var j = SFStore.get(SFStore.slug(name));
    if (!j) return null;
    return { text: SFStore.fmtDue(j), cls: SFStore.dueClass(j),
             sort: j.dueDate ? j.dueDate.getTime() : 8e15 };
  }

  var JOBS = [
    { name:"Kohl's #0394 — Pylon Reface",        client:"Kohl's Corporation",        stage:"Install",     type:"outdoor", value:19500,  due:"Aug 4",          dueSort:4,  priority:"urgent",  filter:"active" },
    { name:"Heritage Bank — Branch Refresh",      client:"Heritage Community Bank",   stage:"Fabrication", type:"indoor",  value:58000,  due:"Aug 8",          dueSort:8,  priority:"urgent",  filter:"active" },
    { name:"Summit Tech Park — Monument Sign",    client:"Summit Tech Park LLC",      stage:"Fabrication", type:"outdoor", value:41000,  due:"Aug 8",          dueSort:8,  priority:"urgent",  filter:"active" },
    { name:"La Paloma Restaurant — Exterior",     client:"La Paloma Group",           stage:"Install",     type:"outdoor", value:11200,  due:"Aug 5",          dueSort:5,  priority:"high",    filter:"active" },
    { name:"Prairie Wind Storage — Exterior",     client:"Prairie Wind Self Storage", stage:"Approval",    type:"outdoor", value:22100,  due:"Aug 7",          dueSort:7,  priority:"normal",  filter:"active" },
    { name:"Village Tap — Blade Sign",            client:"The Village Tap",           stage:"Approval",    type:"outdoor", value:9200,   due:"Aug 1 (overdue)",dueSort:-1, priority:"urgent",  filter:"active" },
    { name:"Northside Gym — Vehicle Wrap",        client:"Northside Fitness",         stage:"Fabrication", type:"indoor",  value:6400,   due:"Aug 6",          dueSort:6,  priority:"high",    filter:"active" },
    { name:"Walgreens #4712 — Façade",            client:"Walgreens (National)",      stage:"Fabrication", type:"outdoor", value:24800,  due:"Aug 12",         dueSort:12, priority:"normal",  filter:"active" },
    { name:"Downtown Diner — Channel Letters",    client:"Main St. Restaurant Group", stage:"Quote",       type:"indoor",  value:7200,   due:"Aug 10",         dueSort:10, priority:"high",    filter:"active" },
    { name:"Riverside Auto — Pylon Sign",         client:"Riverside Automotive",      stage:"Quote",       type:"outdoor", value:18400,  due:"Aug 5",          dueSort:5,  priority:"urgent",  filter:"active" },
    { name:"Westside Fitness",                    client:"Westside Fitness",          stage:"New Inquiry", type:"indoor",  value:null,   due:"—",              dueSort:99, priority:"normal",  filter:"active" },
    { name:"Joliet Tire & Auto",                  client:"Walk-in",                   stage:"New Inquiry", type:"outdoor", value:null,   due:"—",              dueSort:99, priority:"normal",  filter:"active" },
    { name:"Bricktown Brewery — Outdoor Sign",    client:"Bricktown Craft Brewing",   stage:"Quote",       type:"outdoor", value:8600,   due:"Jul 12",         dueSort:-20,priority:"cold",    filter:"cold"   },
    { name:"Valley Fresh Grocery — Storefront",   client:"Valley Fresh Foods",        stage:"Quote",       type:"outdoor", value:14300,  due:"Jun 28",         dueSort:-35,priority:"lost",    filter:"lost"   },
    { name:"Speedway #1188 — LED Retrofit",       client:"Speedway LLC",              stage:"Complete",    type:"indoor",  value:34100,  due:"Jul 30",         dueSort:30, priority:"done",    filter:"complete"},
  ];

  var sortCol = null, sortDir = 1;
  var currentFilter = 'all';
  var currentSearch = '';

  /* ── Toast ── */
  var toastEl = document.getElementById('toast');
  var toastTimer;
  function toast(msg) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2800);
  }

  /* ── Build a row ── */
  function buildRow(job) {
    var tr = document.createElement('tr');
    tr.dataset.filter = job.filter;
    tr.dataset.name   = job.name.toLowerCase();
    tr.dataset.client = job.client.toLowerCase();

    /* stage pill */
    var sc = STAGE_COLORS[job.stage] || {bg:'rgba(255,255,255,0.1)',border:'rgba(255,255,255,0.3)',text:'#fff'};
    var stagePill = '<span class="stage-pill" style="background:'+sc.bg+';border:1px solid '+sc.border+';color:'+sc.text+';">'+job.stage+'</span>';

    /* type badge */
    var typeIcon = job.type === 'indoor' ? '🏠' : '☀️';
    var typeBadge = '<span class="type-badge '+job.type+'">'+typeIcon+' '+job.type.charAt(0).toUpperCase()+job.type.slice(1)+'</span>';

    /* value */
    var valStr = job.value !== null ? '$'+job.value.toLocaleString() : '<span class="value-tbd">TBD</span>';

    /* due — prefer the shared store so an edit made in the pipeline
       shows up here rather than this table keeping its own stale copy. */
    var sd = storeDue(job.name);
    var dueText = sd ? sd.text : (job.due === '—' ? '—' : job.due);
    var dueClass = '';
    if (sd) {
      dueClass = sd.cls === 'overdue' ? 'due-overdue'
               : sd.cls === 'soon'    ? 'due-soon'
               : (dueText === '—' ? 'due-none' : '');
    } else {
      if (job.dueSort < 0)       dueClass = 'due-overdue';
      else if (job.dueSort <= 6) dueClass = 'due-soon';
      else if (job.due === '—')  dueClass = 'due-none';
    }
    var dueStr = '<span class="'+dueClass+'">'+dueText+'</span>';

    /* priority */
    var prioMap = {
      urgent:{ icon:'🔴', label:'Urgent' },
      high:  { icon:'🟡', label:'High'   },
      normal:{ icon:'⚪', label:'Normal' },
      cold:  { icon:'❄️', label:'Cold'  },
      lost:  { icon:'✕',  label:'Lost'  },
      done:  { icon:'✓',  label:'Done'  },
    };
    var p = prioMap[job.priority] || {icon:'⚪',label:job.priority};
    var prioBadge = '<span class="priority-badge '+job.priority+'">'+p.icon+' '+p.label+'</span>';

    tr.innerHTML = [
      '<td><strong>'+job.name+'</strong></td>',
      '<td class="muted">'+job.client+'</td>',
      '<td>'+stagePill+'</td>',
      '<td>'+typeBadge+'</td>',
      '<td style="font-weight:700;">'+valStr+'</td>',
      '<td>'+dueStr+'</td>',
      '<td>'+prioBadge+'</td>',
    ].join('');

    tr.addEventListener('click', function(){
      toast('Opening job: ' + job.name);
    });

    return tr;
  }

  /* ── Render table ── */
  var tbody = document.getElementById('jobs-tbody');
  var emptyState = document.getElementById('empty-state');
  var jobCountEl = document.getElementById('job-count');
  var pipelineValEl = document.getElementById('pipeline-val');

  var rows = JOBS.map(function(job, i){ return { job: job, tr: buildRow(job) }; });
  rows.forEach(function(r){ tbody.appendChild(r.tr); });

  function filterAndSort() {
    var search = currentSearch.toLowerCase().trim();
    var visible = [];

    rows.forEach(function(r){
      var matchFilter = currentFilter === 'all' || r.job.filter === currentFilter;
      var matchSearch = !search ||
        r.job.name.toLowerCase().indexOf(search) !== -1 ||
        r.job.client.toLowerCase().indexOf(search) !== -1 ||
        r.job.stage.toLowerCase().indexOf(search) !== -1;
      var show = matchFilter && matchSearch;
      r.tr.classList.toggle('hidden', !show);
      if (show) visible.push(r);
    });

    /* Sort visible */
    if (sortCol) {
      visible.sort(function(a, b){
        var av, bv;
        if (sortCol === 'name')     { av = a.job.name;     bv = b.job.name; }
        else if (sortCol === 'client') { av = a.job.client; bv = b.job.client; }
        else if (sortCol === 'stage')  { av = a.job.stage;  bv = b.job.stage; }
        else if (sortCol === 'type')   { av = a.job.type;   bv = b.job.type; }
        else if (sortCol === 'value')  { av = a.job.value === null ? -1 : a.job.value; bv = b.job.value === null ? -1 : b.job.value; }
        else if (sortCol === 'due')    { av = a.job.dueSort; bv = b.job.dueSort; }
        else if (sortCol === 'priority') {
          var order = {urgent:0,high:1,normal:2,cold:3,done:4,lost:5};
          av = order[a.job.priority] !== undefined ? order[a.job.priority] : 9;
          bv = order[b.job.priority] !== undefined ? order[b.job.priority] : 9;
        }
        if (av === bv) return 0;
        if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
        return (av > bv ? 1 : -1) * sortDir;
      });
      visible.forEach(function(r){ tbody.appendChild(r.tr); });
    }

    /* Stats */
    var totalVal = visible.reduce(function(s, r){ return s + (r.job.value || 0); }, 0);
    jobCountEl.textContent = visible.length + (visible.length === 1 ? ' job' : ' jobs');
    pipelineValEl.textContent = totalVal > 0 ? '$' + totalVal.toLocaleString() : '—';
    emptyState.style.display = visible.length === 0 ? 'block' : 'none';
  }

  /* ── Sort headers ── */
  document.querySelectorAll('thead th').forEach(function(th){
    th.addEventListener('click', function(){
      var col = th.dataset.col;
      if (sortCol === col) { sortDir = -sortDir; }
      else { sortCol = col; sortDir = 1; }
      document.querySelectorAll('thead th').forEach(function(h){ h.classList.remove('sort-asc','sort-desc'); });
      th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
      filterAndSort();
    });
  });

  /* ── Filter pills ── */
  document.querySelectorAll('.filter-pill').forEach(function(pill){
    pill.addEventListener('click', function(){
      document.querySelectorAll('.filter-pill').forEach(function(p){ p.classList.remove('active'); });
      pill.classList.add('active');
      currentFilter = pill.dataset.filter;
      filterAndSort();
    });
  });

  /* ── Search ── */
  document.getElementById('search-box').addEventListener('input', function(){
    currentSearch = this.value;
    filterAndSort();
  });

  /* Initial render */
  filterAndSort();

})();
</script>

<script src="signflow-engine.js?v=202608160139"></script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   VIEW SWITCHING + SMART CONVERSIONS
   Jobs and Reports are one tab now. Reports is embedded rather than
   inlined so there is still exactly one copy of that chart code.
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var frameLoaded = false;

  function show(view) {
    ['jobs', 'reports', 'wins'].forEach(function (v) {
      var el = document.getElementById('view-' + v);
      if (el) el.style.display = (v === view) ? '' : 'none';
    });
    /* The jobs filter bar only belongs to the jobs table. */
    var sub = document.getElementById('jobs-subbar');
    if (sub) sub.style.display = (view === 'jobs') ? '' : 'none';

    document.querySelectorAll('.vs-tab').forEach(function (t) {
      t.classList.toggle('active', t.getAttribute('data-view') === view);
    });

    if (view === 'reports' && !frameLoaded) {
      document.getElementById('reports-frame').src = 'reports.html?embed=1';
      frameLoaded = true;
    }
    if (view === 'wins') renderWins();

    try { history.replaceState({}, '', view === 'jobs' ? location.pathname
                                                       : '?view=' + view); } catch (e) {}
  }

  document.querySelectorAll('.vs-tab').forEach(function (t) {
    t.addEventListener('click', function () { show(t.getAttribute('data-view')); });
  });

  /* Let the iframe size itself so there is no nested scrollbar.
     The height is set absolutely, never grown, so a stale large value
     cannot strand a screen of empty space below the report. */
  window.addEventListener('message', function (e) {
    if (!e.data || !e.data.sfHeight) return;
    var f = document.getElementById('reports-frame');
    if (!f) return;
    var h = Math.max(320, Math.round(e.data.sfHeight) + 48);
    f.style.height = h + 'px';
  });

  /* ── Smart Conversions render ────────────────────────────────────── */
  function bar(pct, thin) {
    /* 0% must render as an empty track. A minimum-width nub made a
       segment that has never won look like it sometimes does. */
    var w = pct <= 0 ? 0 : Math.max(3, pct);
    return '<div class="wp-bar"><div class="wp-bar-fill' + (thin ? ' thin' : '') +
           '" style="width:' + w + '%"></div></div>';
  }

  function segmentCard(title, sub, rows) {
    var SOLID = (window.SFConversions && SFConversions.SOLID_N) || 8;
    var body = rows.map(function (r) {
      /* Two tiers, matching the banner: under MIN_N is too thin to
         report on, under SOLID_N is a lean rather than a finding. */
      var low = !r.confident
        ? '<span class="wp-lowconf">low sample</span>'
        : (r.n < SOLID ? '<span class="wp-early">early signal</span>' : '');
      var speed = (r.medianDays != null)
        ? r.medianDays + 'd median'
        : 'no wins yet';
      return '<div class="wp-row">'
        + '<div class="wp-row-top">'
        +   '<span class="wp-row-name">' + r.name + low + '</span>'
        +   '<span class="wp-row-meta">' + r.rate + '% · ' + r.wins + '/' + r.n
        +     ' · ' + speed + '</span>'
        + '</div>'
        + bar(r.rate, !r.confident)
        + '</div>';
    }).join('');
    return '<div class="wp-card"><div class="wp-card-title">' + title + '</div>'
         + '<div class="wp-card-sub">' + sub + '</div>' + body + '</div>';
  }

  /* Hoisted: the card builders below live outside renderWins and need
     these too. They were previously locals, so the helpers threw. */
  var W = null, S = null;
  var rendered = false;
  function renderWins() {
    if (rendered) return;
    W = window.SFConversions; S = window.SFStore;
    if (!W || !S) return;
    var a = W.analyse();
    var wrap = document.getElementById('wp-wrap');

    var note = '<div class="wp-note"><span>⚠️</span><span>'
      + '<b>Includes sample history.</b> A new board has no closed jobs, so '
      + 'these figures are seeded with plausible past work to show how the '
      + 'view behaves — treat them as a demonstration, not as measured fact. '
      + 'Counts cover <b>closed</b> jobs (won or lost), including '
      + archivedCount() + ' finished earlier this year that are no longer '
      + 'on the board — so these totals will not match the All Jobs list. '
      + 'Real jobs fold in as you move cards. Segments under ' + W.MIN_N
      + ' jobs are marked <b>low sample</b>; anything under ' + W.SOLID_N
      + ' is worded as an <b>early signal</b> rather than a conclusion.'
      + '</span></div>';

    var fastest = a.fastest
      ? '<div class="wp-fast">Fastest close: <b>' + a.fastest.name + '</b> — '
        + a.fastest.days + ' days from first enquiry to Install.</div>'
      : '';

    var kpis = '<div class="wp-kpis">'
      + kpi('Win rate', a.rate + '%',
            a.wins + ' of ' + a.total + ' closed · incl. ' + archivedCount() + ' archived')
      + kpi('Median days to win', (a.medianDays != null ? a.medianDays + 'd' : '—'),
            'enquiry → Install')
      + kpi('Won value', W.money(a.wonValue), 'across ' + a.wins + ' jobs')
      + kpi('Win line', S.WIN_STAGE, 'stage counted as won')
      + '</div>';

    var ins = '<div class="wp-card"><div class="wp-card-title">What this suggests</div>'
      + '<div class="wp-card-sub">Patterns clearing ' + W.MIN_N + '+ jobs. '
      + 'Those under ' + W.SOLID_N + ' are flagged as early signals.</div>'
      + W.insights(a).map(function (i) {
          return '<div class="wp-insight"><div class="wp-ins-icon">' + i.icon + '</div>'
               + '<div><div class="wp-ins-text">' + i.text + '</div>'
               + '<div class="wp-ins-action">' + i.action + '</div></div></div>';
        }).join('')
      + '</div>';

    var live = W.liveScores(a);

    wrap.innerHTML = note + kpis
      + focusCard(live)
      + stallCard(live)
      + gapCard(live)
      + ins
      + '<div class="wp-hist-head">Track record <span>what has already closed</span></div>'
      + '<div class="wp-grid"><div>'
      + segmentCard('By lead source', 'Where the work comes from', a.bySource)
      + segmentCard('By job size', 'Value band', a.byBand)
      + '</div><div>'
      + segmentCard('By job type', 'Indoor vs outdoor', a.byType)
      + '<div class="wp-card"><div class="wp-card-title">Speed</div>'
      + '<div class="wp-card-sub">Days from first enquiry to ' + S.WIN_STAGE + '</div>'
      + speedRows(a) + fastest + '</div>'
      + '</div></div>';
    rendered = true;
  }

  /* The board shows 15 open jobs, but the win rate is drawn from 21
     closed ones — most of them finished earlier in the year and no
     longer on the board. Saying so prevents the figures looking like
     they contradict the All Jobs tab. */
  function archivedCount() {
    var S = window.SFStore;
    return S ? (S.SEED_CLOSED.length + S.SEED_LOST.length) : 0;
  }

  /* ── Actionable cards ────────────────────────────────────────────
     Win rates are history. These three answer "so what do I do now?",
     and every row links straight to the job on the board. */

  function jobLink(r, inner) {
    return '<a class="wp-job" href="index.html?job=' + encodeURIComponent(r.id) + '">'
         + inner + '</a>';
  }

  function scoreDot(score) {
    var cls = score >= 60 ? 'hot' : (score >= 35 ? 'warm' : 'cool');
    return '<span class="wp-score ' + cls + '">' + score + '%</span>';
  }

  function reasonBits(r) {
    if (!r.reasons.length) return '<span class="wp-why-none">no strong signal either way</span>';
    return r.reasons.slice(0, 3).map(function (x) {
      return '<span class="wp-why ' + (x.good ? 'up' : 'down') + '">'
           + (x.good ? '▲ ' : '▼ ') + x.txt + '</span>';
    }).join('');
  }

  function focusCard(live) {
    if (!live.focus.length) {
      return card('Where to spend your week', 'Nothing open right now',
        '<div class="wp-empty">No open jobs on the board.</div>');
    }
    var rows = live.focus.map(function (r) {
      return jobLink(r,
        '<div class="wp-job-top">'
      +   '<span class="wp-job-name">' + esc(r.name) + '</span>'
      +   scoreDot(r.score)
      + '</div>'
      + '<div class="wp-job-meta">' + r.stage + ' · ' + W.money(r.value)
      +   ' · <b>' + W.money(r.expected) + '</b> weighted</div>'
      + '<div class="wp-why-row">' + reasonBits(r) + '</div>');
    }).join('');
    return card('Where to spend your week',
      'Open jobs ranked by value × likelihood — best call first',
      rows
      + '<div class="wp-foot">' + W.money(live.expectedValue) + ' weighted from '
      + W.money(live.openValue) + ' open</div>');
  }

  function stallCard(live) {
    if (!live.stalling.length) {
      return card('Going quiet', 'Jobs sitting longer than usual',
        '<div class="wp-empty">✓ Nothing stalled — every job is moving on schedule.</div>');
    }
    var rows = live.stalling.slice(0, 6).map(function (r) {
      return jobLink(r,
        '<div class="wp-job-top">'
      +   '<span class="wp-job-name">' + esc(r.name) + '</span>'
      +   '<span class="wp-late">+' + r.overdueBy + 'd</span>'
      + '</div>'
      + '<div class="wp-job-meta">' + r.inStage + ' days in ' + r.stage
      +   ' · usually ' + r.norm + 'd · ' + W.money(r.value) + '</div>');
    }).join('');
    return card('Going quiet',
      live.stalling.length + ' job' + (live.stalling.length > 1 ? 's' : '')
      + ' sitting longer than your usual pace', rows);
  }

  function gapCard(live) {
    if (!live.missingSource.length) return '';
    var names = live.missingSource.slice(0, 8).map(function (r) {
      return jobLink(r, '<span class="wp-chip">' + esc(r.name) + '</span>');
    }).join('');
    return card('Improve these numbers',
      live.missingSource.length + ' open job'
      + (live.missingSource.length > 1 ? 's have' : ' has') + ' no lead source',
      '<div class="wp-gap-txt">Lead source is the strongest predictor here, and it '
      + 'is the one thing only you can record. Set it on these and every number '
      + 'above gets sharper.</div><div class="wp-chips">' + names + '</div>');
  }

  function card(title, sub, body) {
    return '<div class="wp-card"><div class="wp-card-title">' + title + '</div>'
         + '<div class="wp-card-sub">' + sub + '</div>' + body + '</div>';
  }

  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
    });
  }

  function kpi(label, val, sub) {
    return '<div class="wp-kpi"><div class="wp-kpi-label">' + label + '</div>'
         + '<div class="wp-kpi-val">' + val + '</div>'
         + '<div class="wp-kpi-sub">' + sub + '</div></div>';
  }

  function speedRows(a) {
    var wins = a.rows.filter(function (r) { return r.won; })
                     .sort(function (x, y) { return x.days - y.days; });
    if (!wins.length) return '<div class="wp-row-meta">No wins recorded yet.</div>';
    var max = wins[wins.length - 1].days || 1;
    return wins.slice(0, 8).map(function (r) {
      return '<div class="wp-row"><div class="wp-row-top">'
        + '<span class="wp-row-name">' + r.name + '</span>'
        + '<span class="wp-row-meta">' + r.days + 'd · ' + window.SFConversions.money(r.value) + '</span>'
        + '</div>' + bar(Math.round((1 - r.days / max) * 100) || 4) + '</div>';
    }).join('');
  }

  /* Deep link straight to a view. */
  var want = new URLSearchParams(location.search).get('view');
  if (want === 'reports' || want === 'wins') show(want);
})();
</script>
</body>
</html>
